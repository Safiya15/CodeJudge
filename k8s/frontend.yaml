apiVersion: apps/v1
kind: Deployment
metadata:
  name: codejudge-frontend
  namespace: codejudge
  labels:
    app: codejudge-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codejudge-frontend
  template:
    metadata:
      labels:
        app: codejudge-frontend
    spec:
      containers:
        - name: frontend
          image: codejudge-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: codejudge-frontend
  namespace: codejudge
  labels:
    app: codejudge-frontend
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
  selector:
    app: codejudge-frontend
