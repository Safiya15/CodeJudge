apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge0-db
  namespace: codejudge
  labels:
    app: judge0-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: judge0-db
  template:
    metadata:
      labels:
        app: judge0-db
    spec:
      containers:
        - name: postgres
          image: postgres:13.0-alpine
          env:
            - name: POSTGRES_USER
              value: "judge0"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codejudge-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "judge0"
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: judge0-db
  namespace: codejudge
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: judge0-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: judge0
  namespace: codejudge
  labels:
    app: judge0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: judge0
  template:
    metadata:
      labels:
        app: judge0
    spec:
      containers:
        - name: judge0
          image: judge0/judge0:1.13.1
          securityContext:
            privileged: true
          env:
            - name: REDIS_HOST
              value: "redis.codejudge.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: POSTGRES_HOST
              value: "judge0-db.codejudge.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "judge0"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: codejudge-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "judge0"
          ports:
            - containerPort: 2358
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: judge0
  namespace: codejudge
spec:
  ports:
    - port: 2358
      targetPort: 2358
  selector:
    app: judge0
