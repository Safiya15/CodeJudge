global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'codejudge-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:5000']
        labels:
          service: 'codejudge-api'
          environment: 'production'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
